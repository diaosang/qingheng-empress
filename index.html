<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="theme-color" content="#0a1020" />
<title>春庭录 · 帝脉</title>
<style>
:root{--bg:#080d19;--panel:#111a2c;--line:#2d3a57;--text:#edf2ff;--muted:#93a1bc;--gold:#e7b86a;--jade:#6dd4b6;--rose:#e78a9c;--blue:#8fa7f3;--shadow:0 20px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#203256 0,#0b1120 38%,#070b14 100%);color:var(--text);font:15px/1.6 ui-serif,Georgia,"Noto Serif SC",serif}.app{max-width:1260px;margin:auto;padding:22px 18px 52px}button{font:inherit;color:inherit}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.25em;color:var(--gold)}h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:.08em;margin:6px 0}.subtitle{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.2s}.btn:hover{border-color:var(--gold);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#e8bd70,#a56c4a);color:#18121c;border:0;font-weight:700}.btn.danger{border-color:#854853;color:#ffb2b7}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:15px}.main,.side{min-width:0}.panel{background:linear-gradient(145deg,rgba(25,37,63,.96),rgba(12,18,31,.97));border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:17px}.hero{min-height:210px;position:relative;overflow:hidden;padding:22px}.hero:after{content:"❖";position:absolute;right:26px;top:14px;color:rgba(231,184,106,.17);font-size:118px;line-height:1}.kicker{color:var(--jade);font-size:13px;letter-spacing:.12em}.hero h2{font-size:clamp(23px,3vw,35px);margin:7px 0 9px;max-width:720px}.story{white-space:pre-line;color:#d8e1f4;max-width:760px;margin:0}.quote{border-left:2px solid var(--gold);padding-left:13px;color:#efd6a2;font-size:13px;max-width:780px;margin:14px 0 0;white-space:pre-line}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:14px}.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:10px}.stat label{display:block;font-size:11px;color:var(--muted)}.value{font-size:21px;color:var(--gold);font-variant-numeric:tabular-nums}.meter{height:4px;background:#26334e;border-radius:99px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));transition:width .35s}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav button{border:1px solid var(--line);background:rgba(255,255,255,.025);padding:8px 13px;border-radius:9px;cursor:pointer;color:var(--muted)}.nav button.active{background:var(--gold);color:#1b1520;border-color:var(--gold);font-weight:700}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-head h3{font-size:18px;margin:0}.tag{font-size:11px;border:1px solid #475879;border-radius:99px;padding:2px 8px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{min-height:92px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:12px;padding:12px;cursor:pointer;transition:.2s}.action:hover{border-color:var(--jade);background:rgba(109,212,182,.08);transform:translateY(-2px)}.action b{display:block;color:#f2d9a2;margin-bottom:4px}.action span{color:var(--muted);font-size:12px}.row-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card-row{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:12px}.card-row h4{margin:0 0 3px;color:#f0d4a0;font-size:15px}.card-row p{margin:3px 0;color:var(--muted);font-size:12px}.mini-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}.mini-bar i{display:block;height:5px;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px}.faction{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:9px;margin:9px 0}.faction b{font-size:13px}.track{height:7px;background:#27334c;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;border-radius:inherit;background:var(--jade)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}.table th{color:var(--muted);font-weight:400;font-size:11px}.log{max-height:276px;overflow:auto}.log-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;color:#ccd6e8}.log-item time{color:var(--gold);font-size:11px;margin-right:7px}.side .panel+.panel{margin-top:14px}.alert{border:1px solid #724351;background:rgba(156,58,74,.14);border-radius:11px;padding:11px;color:#ffc0c3;font-size:12px;margin-bottom:12px}.ok{border-color:#37655d;background:rgba(52,129,108,.13);color:#b3f0d9}.event{border:1px solid #6f5d42;background:rgba(175,127,54,.1);border-radius:12px;padding:12px;margin-top:12px}.event h4{margin:0;color:#f1d7a3}.event p{white-space:pre-line;color:#d3dced;font-size:13px}.choice-list{display:grid;gap:8px}.choice{width:100%;text-align:left;border:1px solid #425171;background:#182642;border-radius:10px;padding:10px 11px;cursor:pointer}.choice:hover{border-color:var(--rose);background:#29283f}.choice b{display:block;color:#f4d8a4;font-size:13px}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.history{max-height:460px;overflow:auto}.history-item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}.history-item strong{color:var(--gold);font-weight:500}.modal{position:fixed;inset:0;background:rgba(3,7,15,.8);display:none;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.modal-card{max-width:650px;width:100%;max-height:90vh;overflow:auto;background:#111a2c;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.modal-card h3{font-size:24px;margin:0 0 9px}.modal-card p{color:#ced8e8;white-space:pre-line}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.footer{text-align:center;color:#73819e;font-size:11px;margin-top:17px}@media(max-width:980px){.shell{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side .panel+.panel{margin-top:0}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(3,1fr)}.action-grid,.row-grid{grid-template-columns:1fr}.side{display:block}.side .panel+.panel{margin-top:14px}}@media(max-width:430px){.app{padding:16px 11px 38px}.stats{grid-template-columns:repeat(2,1fr)}.nav button{flex:1 0 auto}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div><div class="eyebrow" id="dateLine">大晏 · 景和元年 · 春</div><h1>春庭录</h1><div class="subtitle">你可以亲手培养下一位女帝，但无法替她决定，如何处置你留下的天下。</div></div><div class="top-actions"><button class="btn" id="saveBtn">存档</button><button class="btn" id="loadBtn">读档</button><button class="btn danger" id="restartBtn">重开</button></div></header>
<section class="shell"><div class="main"><article class="panel hero"><div class="kicker" id="chapter">第一幕 · 雪账</div><h2 id="storyTitle">雪夜授印</h2><p class="story" id="storyText"></p><p class="quote" id="quote"></p></article>
<div class="stats"><div class="stat"><label>国库</label><div class="value" id="treasury">160</div><div class="meter"><i id="treasuryBar"></i></div></div><div class="stat"><label>皇权</label><div class="value" id="authority">55</div><div class="meter"><i id="authorityBar"></i></div></div><div class="stat"><label>民生</label><div class="value" id="livelihood">60</div><div class="meter"><i id="livelihoodBar"></i></div></div><div class="stat"><label>军备</label><div class="value" id="military">55</div><div class="meter"><i id="militaryBar"></i></div></div><div class="stat"><label>健康</label><div class="value" id="health">88</div><div class="meter"><i id="healthBar"></i></div></div><div class="stat"><label>情报</label><div class="value" id="intel">8</div><div class="meter"><i id="intelBar"></i></div></div><div class="stat"><label>御前行动</label><div class="value" id="actions">3</div><div class="meter"><i id="actionsBar"></i></div></div></div>
<nav class="nav" id="nav"><button data-view="court" class="active">御前</button><button data-view="politics">朝堂</button><button data-view="people">朝臣</button><button data-view="harem">后宫</button><button data-view="genealogy">子嗣与宗谱</button><button data-view="history">史册</button></nav>
<section class="panel" id="view"></section></div>
<aside class="side"><article class="panel"><div class="section-head"><h3>朝局温度</h3><span class="tag" id="riskTag">可控</span></div><div id="riskBox"></div><div id="factions"></div></article><article class="panel"><div class="section-head"><h3>风声簿</h3><span class="small">最近十八条</span></div><div class="log" id="log" aria-live="polite"></div></article></aside></section>
<div class="footer">《春庭录 · 帝脉》网页原型　|　每季三点行动　|　国策、关系与历史会跨代留下</div></main>
<div class="modal" id="modal"><div class="modal-card"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="choice-list" id="modalChoices"></div><div class="modal-actions"><button class="btn" id="modalClose">稍后再议</button></div></div></div>
<script>
const VERSION=4;
const initial={version:VERSION,year:1,season:1,actions:3,view:'court',tutorialSeen:false,ruler:'萧照夜',treasury:160,authority:55,livelihood:60,military:55,health:88,intel:8, tax:1,caseStage:0,caseFlags:{},policies:{taxAudit:false,publicSelection:false,directPay:false,secretReview:false},offices:[{name:'吏部',holder:'沈砚',faction:'沈氏士族'},{name:'户部',holder:'顾言',faction:'顾氏台谏'},{name:'礼部',holder:'空缺',faction:'待任'},{name:'兵部',holder:'卫昭',faction:'卫氏军族'},{name:'刑部',holder:'顾氏门生',faction:'顾氏台谏'},{name:'工部',holder:'裴宁',faction:'内廷'}],heir:null,history:[],log:[],factions:{shen:44,wei:38,gu:34,court:30},people:[{id:'shen-yan',name:'沈砚',age:28,role:'吏部侍郎',faction:'沈氏士族',trust:42,intimacy:20,loyalty:55,ambition:68,principle:'不替整族签一张免责文书',note:'他知道谁能升官，也知道谁不该升。'},{id:'wei-zhao',name:'卫昭',age:27,role:'北境将军',faction:'卫氏军族',trust:48,intimacy:16,loyalty:62,ambition:61,principle:'不拿士兵伤亡遮掩朝廷失误',note:'她从边城回来，带回一封没有盖印的军报。'},{id:'gu-yan',name:'顾言',age:26,role:'左都御史',faction:'顾氏台谏',trust:36,intimacy:11,loyalty:72,ambition:49,principle:'不删掉已经看见的事实',note:'他说话像把刀放在桌上，先让你看见刀背。'},{id:'pei-ning',name:'裴宁',age:25,role:'内廷案牍官',faction:'内廷',trust:51,intimacy:24,loyalty:46,ambition:53,principle:'不以一生秘密换取被占有',note:'先帝的朱批经过他的手，也可能死在他的手里。'}],harem:[{id:'xie-shenbi',name:'谢沉璧',title:'昭仪',family:'西陵谢氏',affection:34,trust:38,jealousy:18,principle:'不愿成为一纸和约的活印章',note:'他带着边国的玉佩入宫，知道自己也是一枚筹码。'},{id:'lu-qingshang',name:'陆清商',title:'贵君',family:'羽林陆氏',affection:27,trust:52,jealousy:11,principle:'不接受用宠爱替代尊重',note:'她曾掌羽林，离开军府后仍有人听她的口令。'},{id:'gu-lianzhi',name:'顾连枝',title:'才人',family:'寒门',affection:21,trust:44,jealousy:7,principle:'想要一次凭自己名字留下的晋升',note:'她不争后位，只争一个不靠谁的出身。'}],heirs:[{id:'xiao-rong',name:'萧容',age:16,school:'经义通识',potential:64,public:39,official:36,military:22,law:40,trait:'谨慎，记性极好',memo:'她会先问这条命令由谁执行。'},{id:'xiao-yu',name:'萧瑜',age:15,school:'边镇见习',potential:71,public:47,official:24,military:51,law:40,trait:'锋利，讨厌被保护',memo:'她不怕马，也不怕把问题问到母亲脸上。'},{id:'xiao-shu',name:'萧姝',age:17,school:'官署历练',potential:59,public:31,official:55,military:21,law:40,trait:'温和，擅长记住欠下的人情',memo:'她的老师比她更早知道她会成为谁。'}]};
const cached=JSON.parse(localStorage.getItem('chunting-save')||'null');let s=(cached&&cached.version===VERSION)?cached:structuredClone(initial);let modalOpen=false;
const $=id=>document.getElementById(id), clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const seasonNames=['春','夏','秋','冬'];
const chapters=[{chapter:'第一幕 · 雪账',title:'雪夜授印',text:'先帝下葬的第三日，户部送来一册新账。封皮是新换的，纸却有旧年烟火的气味。\n末页“赈毕”二字写得端正，像这天下所有饥饿，都已被一个善于收尾的人安置妥当。',quote:'“旧账呢？”\n户部尚书伏在地上，说旧账毁于库火。朕没有追问第二遍，只把玉玺按在那一页上。'},{chapter:'第二幕 · 渡口',title:'账上沉船，水里活人',text:'渡口说有一船粮沉了，船工却说他们卸过货。\n证人活着，账也活着。只有那些被写进“已赈”的人，没法来替自己辩一句。',quote:'裴宁把一卷描红放在案边。最后十几页没有字，只有挤得极密的人名。'},{chapter:'第三幕 · 玉牒',title:'士族把一纸旧账递到储君名下',text:'沈氏愿意帮朕册立储君，条件是旧案封口，吏部三席归他们。\n这不是交易，这是他们教朕如何把女儿写进一笔债。',quote:'“陛下可以拒绝。”沈砚说，“只是拒绝之后，您要自己面对没有人替您点灯的夜。”'},{chapter:'第四幕 · 宫门',title:'欠饷的军队没有耐心等史书',text:'边军逼近京城。有人喊要粮，有人喊要命，还有人只想趁乱把旧账烧干净。\n卫昭的军报只有八个字：军心未反，人心已乱。',quote:'朕第一次想，皇权若只能靠别人替我发饷，那它究竟是不是我的。'},{chapter:'终幕 · 朱批',title:'先帝的字，终于落到朕手里',text:'朱批是真的。先帝批准过最初的挪用，却不是唯一一个从中获利的人。\n真相若只用来处死一个死人，便仍是一种方便的谎言。',quote:'朕要追责，也要补位；要让死者有姓名，也要让活人继续吃饭。'}];
const policies=[['taxAudit','税账复核','国库 -20；每季维护 -2。账目线索更可靠，民生趋稳。'],['publicSelection','选官公开','皇权 -5；沈氏支持下降，官僚公信上升。'],['directPay','军饷直达','国库 -25；军备 +8，卫氏不再替中间人遮掩。'],['secretReview','密折复核','国库 -12；降低构陷风险，但危机会更慢。']];
function addLog(msg){s.log.unshift({year:s.year,season:s.season,msg});s.log=s.log.slice(0,18)}function history(msg,kind='决断'){s.history.unshift({year:s.year,season:s.season,kind,msg});s.history=s.history.slice(0,80);addLog(msg)}function save(){localStorage.setItem('chunting-save',JSON.stringify(s))}function fmtSeason(){return `景和${s.year}年 · ${seasonNames[s.season-1]}`}function spend(n){if(s.actions<n){openModal('御前行动不足','这一季还剩 '+s.actions+' 点行动。你可以查看人物与史册，但不能再把手伸进更多棋局。',[]);return false}s.actions-=n;return true}function bar(id,value,max=100){$(id).style.width=clamp(value,0,max)/max*100+'%'}function currentChapter(){return chapters[Math.min(4,Math.max(0,s.caseStage))]}
function render(){const c=currentChapter();$('dateLine').textContent='大晏 · '+fmtSeason();$('chapter').textContent=c.chapter;$('storyTitle').textContent=c.title;$('storyText').textContent=c.text;$('quote').textContent=c.quote;['treasury','authority','livelihood','military','health','intel','actions'].forEach(k=>$(k).textContent=s[k]);bar('treasuryBar',s.treasury,200);bar('authorityBar',s.authority);bar('livelihoodBar',s.livelihood);bar('militaryBar',s.military);bar('healthBar',s.health);bar('intelBar',s.intel,20);bar('actionsBar',s.actions,3);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view));renderRisk();renderFactions();renderLog();renderView();save()}
function renderLog(){$('log').innerHTML=s.log.map(x=>`<div class="log-item"><time>景和${x.year}·${seasonNames[x.season-1]}</time>${x.msg}</div>`).join('')||'<div class="small">风还没起。先听一份奏报。</div>'}function renderFactions(){const names=[['shen','沈氏士族'],['wei','卫氏军族'],['gu','顾氏台谏'],['court','内廷']];$('factions').innerHTML=names.map(([id,name])=>`<div class="faction"><b>${name}</b><div class="track"><i style="width:${clamp(s.factions[id])}%"></i></div><span>${s.factions[id]}</span></div>`).join('')}
function renderRisk(){const risks=[];if(s.treasury<0)risks.push('国库透支：欠饷与政策停摆风险升高。');if(s.authority<30)risks.push('皇权低于三十：逼宫筹备可能进入倒计时。');if(s.military<40)risks.push('军备不足：卫氏会要求你先回答边军。');if(s.factions.shen>65)risks.push('沈氏关键席位过多：支持正在变成条件。');if(s.caseStage<4)risks.push('《雪账》未结：每一季拖延都会让证人更难保护。');$('riskTag').textContent=risks.length>2?'紧绷':risks.length?'有暗流':'可控';$('riskBox').innerHTML=risks.map(x=>`<div class="alert">${x}</div>`).join('')||'<div class="alert ok">暂时没有立即爆发的危机。你可以把行动留给真正重要的人。</div>'}
function renderView(){if(s.view==='court')renderCourt();if(s.view==='politics')renderPolitics();if(s.view==='people')renderPeople();if(s.view==='harem')renderHarem();if(s.view==='genealogy')renderGenealogy();if(s.view==='history')renderHistory()}
function renderCourt(){$('view').innerHTML=`<div class="section-head"><h3>御前 · 本季三点行动</h3><span class="tag">剩余 ${s.actions}/3 · 点击卡片开始</span></div><div class="alert ok"><b>当前目标：</b>${s.caseStage<2?'保护渡口证人并查清沉船账目':s.caseStage<4?'拿到先帝朱批，决定公开还是封存':'把雪账写进史册，并为下一代留下可接手的朝局'}<br><span class="small">进入人物、后宫、子嗣页面只是查看；真正选择按钮会明确标出行动成本。</span></div><div class="action-grid"><button class="action" data-action="court"><b>⚖ 临朝问政 · 1行动</b><span>逐项追问六部执行，皇权 +4，台谏支持上升。</span></button><button class="action" data-action="visit"><b>◈ 召见朝臣</b><span>进入朝臣页；选择具体人物时才消耗 1行动。</span></button><button class="action" data-action="harem"><b>♡ 召见后宫</b><span>进入后宫页；召见、赏赐、冷落各有代价。</span></button><button class="action" data-action="investigate"><b>⌕ 立案调查 · 1行动</b><span>情报 +2，推进《雪账》，也会惊动内廷。</span></button><button class="action" data-action="policy"><b>✦ 批阅国策</b><span>进入朝堂页；实施制度时消耗 1行动与国库。</span></button><button class="action" data-action="heir"><b>♔ 陪伴子嗣</b><span>进入子嗣与宗谱页；选择具体子嗣时才消耗 1行动。</span></button><button class="action" data-action="rest"><b>☾ 休养 · 1行动</b><span>健康 +8，给下一季留出判断的余地。</span></button></div><div class="event"><h4>本季合并奏报</h4><p>${reportText()}</p><button class="btn primary" data-action="advance">结束本季${s.actions?'（剩余 '+s.actions+' 行动）':''}</button></div>`;bindActions()}
function reportText(){if(s.treasury<0)return'户部请求停发宫廷用度，兵部则把欠饷清单压在最上面。你可以继续查案，但下一季开始前必须面对钱从哪里来。';if(s.military<40)return'北境军报连续三日入宫。卫昭没有催你，只把“粮”字写得比往常更重。';if(s.caseStage<4)return'御史台递来一封无名折，指向一条已被火烧过的转运线。没有人署名，也没有人愿意说它不存在。';return'史馆请求确认《雪账》的公开版本。你可以把罪责写得更干净，也可以把自己的名字写进责任里。'}
function renderPolitics(){$('view').innerHTML=`<div class="section-head"><h3>朝堂 · 六部与制度</h3><span class="tag">税率 ${s.tax.toFixed(1)}x · 调整税率 1行动</span></div><div class="card-row" style="margin-bottom:12px"><h4>税率与民生</h4><p>低税让民生缓慢恢复，高税当年多收，下一年度会留下民生代价。每次调整消耗 1 行动。</p><button class="btn ${s.tax===.8?'primary':''}" data-tax=".8">低税 0.8x · 1行动</button> <button class="btn ${s.tax===1?'primary':''}" data-tax="1">常税 1.0x · 1行动</button> <button class="btn ${s.tax===1.2?'primary':''}" data-tax="1.2">高税 1.2x · 1行动</button></div><table class="table"><thead><tr><th>官职</th><th>现任</th><th>所属</th><th>动作</th></tr></thead><tbody>${s.offices.map((r,i)=>`<tr><td>${r.name}</td><td>${r.holder}</td><td>${r.faction}</td><td><button class="btn" data-appoint="${i}">调整 · 1行动</button></td></tr>`).join('')}</tbody></table><hr><div class="section-head"><h3>长期制度</h3><span class="small">制度会留下维护费，也会留下受益人</span></div><div class="row-grid">${policies.map(p=>`<div class="card-row"><h4>${p[1]} ${s.policies[p[0]]?'· 已施行':'· 未施行'}</h4><p>${p[2]}</p><button class="btn ${s.policies[p[0]]?'':'primary'}" data-policy="${p[0]}" ${s.policies[p[0]]?'disabled':''}>${s.policies[p[0]]?'运行中':'实施制度 · 1行动'}</button></div>`).join('')}</div>`;bindActions();document.querySelectorAll('[data-tax]').forEach(b=>b.onclick=()=>{const next=+b.dataset.tax;if(next===s.tax){openModal('税率未变','本季税率已经是 '+s.tax.toFixed(1)+' 倍。',[]);return}if(!spend(1))return;s.tax=next;history('朕把税率调为 '+s.tax.toFixed(1)+' 倍，民生的账不会立刻显出代价。','财政');render()})}
function renderPeople(){$('view').innerHTML=`<div class="section-head"><h3>人物 · 关系是有方向的</h3><span class="small">亲密、信任、忠诚与野心分开计算</span></div><div class="row-grid">${s.people.map(p=>`<div class="card-row"><h4>${p.name} <span class="tag">${p.role}</span></h4><p>${p.faction} · ${p.note}</p><p>原则：${p.principle}</p><div class="mini-bar">信任 ${p.trust}<i style="width:${p.trust}%"></i></div><div class="mini-bar">忠诚 ${p.loyalty}<i style="width:${p.loyalty}%"></i></div><div class="mini-bar">野心 ${p.ambition}<i style="width:${p.ambition}%"></i></div><div style="margin-top:9px"><button class="btn primary" data-person="${p.id}">亲访 · 1行动</button> <button class="btn" data-intel="${p.id}">查底 · 1情报</button></div></div>`).join('')}</div>`;bindActions()}
function renderHarem(){$('view').innerHTML=`<div class="section-head"><h3>后宫 · 恩宠也是朝局</h3><span class="tag">每项互动消耗 1 行动</span></div><div class="alert">后宫不是装饰。召见会积累信任，赏赐会消耗国库并改变嫉妒，冷落能收回一点主动权，却会留下关系裂痕。先看清代价，再落子。</div><div class="row-grid">${s.harem.map(h=>`<div class="card-row"><h4>${h.name} <span class="tag">${h.title}</span></h4><p>${h.family} · ${h.note}</p><p>底线：${h.principle}</p><div class="mini-bar">情意 ${h.affection}<i style="width:${h.affection}%"></i></div><div class="mini-bar">信任 ${h.trust}<i style="width:${h.trust}%"></i></div><div class="mini-bar">嫉妒 ${h.jealousy}<i style="width:${h.jealousy}%"></i></div><div style="margin-top:9px"><button class="btn primary" data-harem-id="${h.id}" data-harem-action="summon">召见 · 1行动</button> <button class="btn" data-harem-id="${h.id}" data-harem-action="gift">赏赐 · 1行动</button> <button class="btn" data-harem-id="${h.id}" data-harem-action="neglect">冷落 · 1行动</button></div></div>`).join('')}</div><div class="event"><h4>内廷风声</h4><p>${haremReport()}</p></div>`;bindActions()}
function haremReport(){const h=[...s.harem].sort((a,b)=>b.affection-a.affection)[0];if(!h)return'后宫尚未入册。';if(h.jealousy>=55)return'嫉妒已经越过礼法能遮住的线。再有一场失衡的恩宠，内廷会先替你做出选择。';if(h.affection<20)return h.name+'的宫灯常常彻夜未燃。她没有闹，只是不再相信自己会被看见。';return'今夜最受宠的是'+h.name+'。她的家族会把这份恩宠解释成一纸承诺，宫外的人也在等你兑现。'}
function haremAction(id,type){if(!spend(1))return;const h=s.harem.find(x=>x.id===id);if(!h)return;if(type==='summon'){h.affection=clamp(h.affection+5);h.trust=clamp(h.trust+4);h.jealousy=clamp(h.jealousy+1);s.authority=clamp(s.authority+1);history(`朕召见${h.name}，先问她愿意留下什么，再问她愿意替谁说话。`,'内廷')}if(type==='gift'){if(s.treasury<6){s.actions++;openModal('国库不允','赏赐至少要从国库拨出 6。你可以改为召见，或把这一点行动留到别处。',[]);return}s.treasury-=6;h.affection=clamp(h.affection+7);h.trust=clamp(h.trust+1);h.jealousy=clamp(h.jealousy+2);history(`朕赏赐${h.name}六金，宫里记住的是恩典，户部记住的是出处。`,'内廷')}if(type==='neglect'){h.affection=clamp(h.affection-3);h.trust=clamp(h.trust-2);h.jealousy=clamp(h.jealousy-5);s.authority=clamp(s.authority+1);history(`朕冷落${h.name}一季，收回一寸主动，也让她的家族听见了宫门合上的声音。`,'内廷')}render()}
function heirSupport(h){return Math.round(h.law*.4+h.public*.2+h.official*.2+h.military*.2)}
function renderGenealogy(){$('view').innerHTML=`<div class="section-head"><h3>宗谱 · 储君与交接</h3><span class="tag">每项互动 1行动</span></div><div class="alert">册立不等于复制母亲。先用下方按钮陪伴、授课或派往见习，亲手塑造她们的支持度与执政方向；每次互动都会写入史册。</div><div class="row-grid">${s.heirs.map(h=>{const support=heirSupport(h),chosen=s.heir===h.id;return`<div class="card-row"><h4>${h.name} · ${h.age}岁 ${chosen?'<span class="tag">已册立</span>':''}</h4><p>${h.trait} · ${h.school}</p><p>${h.memo}</p><div class="mini-bar">法统 ${h.law}<i style="width:${h.law}%"></i></div><div class="mini-bar">民望 ${h.public}<i style="width:${h.public}%"></i></div><div class="mini-bar">官署 ${h.official}<i style="width:${h.official}%"></i></div><div class="mini-bar">军务 ${h.military}<i style="width:${h.military}%"></i></div><div class="mini-bar">支持度 ${support}<i style="width:${support}%"></i></div><div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn primary" data-heir-action="companion" data-heir-id="${h.id}">陪伴 · 1行动</button><button class="btn" data-heir-action="study" data-heir-id="${h.id}">安排课程 · 1行动</button><button class="btn" data-heir-action="apprentice" data-heir-id="${h.id}">派往见习 · 1行动</button></div><button class="btn ${chosen?'':'primary'}" data-heir="${h.id}" ${chosen?'disabled':''} style="margin-top:8px">${chosen?'储君已定':'册立为储君 · 2行动'}</button></div>`}).join('')}</div><div class="event"><h4>交接预警</h4><p>${s.heir?'当前储君的支持度为 '+heirSupport(s.heirs.find(h=>h.id===s.heir))+'。若皇权在交接前跌破三十，旧臣会要求摄政。':'尚未册立储君。宗室仍有补救空间，但每一季拖延都会给派系更多议价时间。'}</p><button class="btn" data-action="handover" ${s.heir&&s.year>=5?'':'disabled'}>禅位交接${s.year<5?' · 景和五年后开放':''}</button></div>`;bindActions()}
function renderHistory(){$('view').innerHTML=`<div class="section-head"><h3>史册 · 事实、承诺与代价</h3><span class="small">下一代只会继承真正发生过的事</span></div><div class="history">${s.history.map(h=>`<div class="history-item"><strong>景和${h.year}·${seasonNames[h.season-1]} · ${h.kind}</strong><br>${h.msg}</div>`).join('')||'<div class="small">还没有写入史册。第一道诏书会从这里开始留下回声。</div>'}</div>`}
function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>doAction(b.dataset.action));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>visitPerson(b.dataset.person));document.querySelectorAll('[data-intel]').forEach(b=>b.onclick=()=>inspectPerson(b.dataset.intel));document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>implementPolicy(b.dataset.policy));document.querySelectorAll('[data-appoint]').forEach(b=>b.onclick=()=>appoint(+b.dataset.appoint));document.querySelectorAll('[data-heir]').forEach(b=>b.onclick=()=>chooseHeir(b.dataset.heir));document.querySelectorAll('[data-heir-action]').forEach(b=>b.onclick=()=>heirAction(b.dataset.heirId,b.dataset.heirAction));document.querySelectorAll('[data-harem-id]').forEach(b=>b.onclick=()=>haremAction(b.dataset.haremId,b.dataset.haremAction))}
function doAction(type){if(type==='court'&&spend(1)){s.authority=clamp(s.authority+4);s.factions.gu=clamp(s.factions.gu+2);history('朕在金殿上要求六部逐项报执行，不许只报“已阅”。');render()}if(type==='visit'){s.view='people';render()}if(type==='harem'){s.view='harem';render()}if(type==='investigate'&&spend(1)){s.intel+=2;s.caseStage=Math.min(4,s.caseStage+1);s.factions.court=clamp(s.factions.court-3);history('朕把《雪账》改为正式案，要求证人与账册分开保全。','主线');render()}if(type==='policy'){s.view='politics';render()}if(type==='heir'){s.view='genealogy';render()}if(type==='rest'&&spend(1)){s.health=clamp(s.health+8);history('朕推掉一场无关紧要的宴饮，在灯下睡了一个完整的时辰。','自持');render()}if(type==='advance')confirmAdvance();if(type==='handover')handover()}
function visitPerson(id){if(!spend(1))return;const p=s.people.find(x=>x.id===id);p.trust=clamp(p.trust+6);p.intimacy=clamp(p.intimacy+3);if(id==='shen-yan')s.factions.shen=clamp(s.factions.shen+3);if(id==='wei-zhao')s.factions.wei=clamp(s.factions.wei+3);if(id==='gu-yan')s.factions.gu=clamp(s.factions.gu+3);if(id==='pei-ning')s.factions.court=clamp(s.factions.court+3);history(`朕亲访${p.name}。他没有立刻表忠，只说了自己的底线。`,'关系');render()}
function inspectPerson(id){if(s.intel<1){openModal('情报不足','你没有足够的线人去撬开更多底牌。',[]);return}s.intel--;const p=s.people.find(x=>x.id===id);openModal(p.name+'的底牌',`信任 ${p.trust} · 忠诚 ${p.loyalty} · 野心 ${p.ambition}\n\n${p.name}真正害怕的不是失宠，而是被迫替别人背下一个没有署名的决定。`,[]);history('朕让线人查了'+p.name+'的旧档，知道比公开档案多一层的事。','情报');render()}
function implementPolicy(id){if(s.policies[id])return;const p=policies.find(x=>x[0]===id),costs={taxAudit:20,publicSelection:0,directPay:25,secretReview:12},cost=costs[id];if(s.treasury<cost){openModal('国库不允','这项制度需要 '+cost+' 国库，你现在只有 '+s.treasury+'。',[]);return}if(!spend(1))return;s.treasury-=cost;s.policies[id]=true;if(id==='taxAudit'){s.livelihood=clamp(s.livelihood+4);s.factions.court=clamp(s.factions.court-5)}if(id==='publicSelection'){s.authority=clamp(s.authority-5);s.factions.shen=clamp(s.factions.shen-10);s.factions.gu=clamp(s.factions.gu+8)}if(id==='directPay'){s.military=clamp(s.military+8);s.factions.wei=clamp(s.factions.wei+7)}if(id==='secretReview'){s.intel+=3;s.authority=clamp(s.authority+2)}history('朕颁行《'+p[1]+'》，把制度的维护费也写在诏书末尾。','制度');render()}
function appoint(i){if(!spend(1))return;const role=['礼部尚书','户部尚书','刑部尚书','工部尚书','太常卿','枢密副使'][i]||'关键官职',office=s.offices[i];openModal('调整 · '+role,'你可以把这个位置交给谁？任官会改变派系席位，也会改变旧臣对你的解释。',[{label:'让顾氏门生暂代',desc:'官僚支持 +5，沈氏支持 -3，皇权 -1',run:()=>{if(office){office.holder='顾氏门生';office.faction='顾氏台谏'}s.factions.gu=clamp(s.factions.gu+5);s.factions.shen=clamp(s.factions.shen-3);s.authority=clamp(s.authority-1);history('朕让顾氏门生暂代'+role+'，给程序一个先于人情的位置。','任官')}},{label:'让沈氏推荐人选',desc:'沈氏支持 +7，但关键席位继续集中',run:()=>{if(office){office.holder='沈氏推荐人';office.faction='沈氏士族'}s.factions.shen=clamp(s.factions.shen+7);s.authority=clamp(s.authority+2);history('朕接受沈氏推荐，换来一夜稳定和一笔看不见的债。','任官')}},{label:'暂时空缺',desc:'皇权 +2，执行效率下降',run:()=>{if(office){office.holder='空缺';office.faction='待任'}s.authority=clamp(s.authority+2);s.livelihood=clamp(s.livelihood-1);history('朕宁可让职位空着，也不把一把刀交给不认识刀柄的人。','任官')}}])}
function chooseHeir(id){if(!spend(2))return;const h=s.heirs.find(x=>x.id===id);s.heir=id;s.authority=clamp(s.authority+3);history('朕册立'+h.name+'为储君。支持她的人开始向她而不是向朕递话。','继承');render()}
function heirAction(id,type){const h=s.heirs.find(x=>x.id===id);if(!h||!spend(1))return;if(type==='companion'){h.public=clamp(h.public+5);h.law=clamp(h.law+2);history('朕陪'+h.name+'走过一遍宫门，让她先记住百姓的脸，再记住礼制的名字。','亲子')}if(type==='study'){h.official=clamp(h.official+5);h.law=clamp(h.law+3);history('朕为'+h.name+'安排官署课程，要求她把每一道批文都写明由谁负责。','亲子')}if(type==='apprentice'){h.military=clamp(h.military+6);h.public=clamp(h.public+2);history('朕把'+h.name+'派往见习，让她在边镇与官署之外，先学会听军报里的停顿。','亲子')}render()}
function confirmAdvance(){if(modalOpen)return;const income=Math.round(30*(.5+s.livelihood/100)*s.tax),cost=27+(s.policies.taxAudit?2:0)+(s.policies.secretReview?1:0);openModal('结束本季？','你还剩 '+s.actions+' 点行动。结束后将结算收入 '+income+'、支出 '+cost+'，未处理的奏报会继续发酵。',[{label:'结束本季，查看结算',desc:'恢复 3 点行动并推进季节事件',run:()=>advanceSeason()}]);}
function advanceSeason(){if(modalOpen)return;s.season++;if(s.season>4){s.season=1;s.year++;s.health=clamp(s.health-.8);s.livelihood=clamp(s.tax>1?s.livelihood-4:s.tax<1?s.livelihood+2:s.livelihood)}const income=Math.round(30*(.5+s.livelihood/100)*s.tax),cost=27+(s.policies.taxAudit?2:0)+(s.policies.secretReview?1:0);s.treasury+=income-cost;s.actions=3;if(s.treasury<0){s.military=clamp(s.military-3);s.authority=clamp(s.authority-2)}if(s.policies.directPay)s.military=clamp(s.military+1);else s.military=clamp(s.military-1);if(s.caseStage===1&&s.season===3)s.caseStage=2;history(`过季结算：收入 ${income}，支出 ${cost}，净变化 ${income-cost}。`,'季报');render();const event=nextEvent();if(event)openModal(event.title,event.text,event.choices,false)}
function nextEvent(){if(s.year===1&&s.season===2&&s.caseStage<2)return{title:'渡口无名',text:'船已靠岸，账上却记沉没。一个船工愿意作证，但他的女儿还在沈氏名下的田庄做事。',choices:[{label:'先保护证人，再接管转运',desc:'情报 +2，沈氏支持 -5，民生 +2',run:()=>{s.intel+=2;s.factions.shen=clamp(s.factions.shen-5);s.livelihood=clamp(s.livelihood+2);s.caseStage=Math.max(2,s.caseStage);history('朕把证人家属迁入京城，先让人活着，证词才有意义。','主线')}},{label:'用证人换沈氏交出账册',desc:'获得线索，沈氏支持 +3，但证人失去安全',run:()=>{s.intel+=3;s.factions.shen=clamp(s.factions.shen+3);s.caseStage=Math.max(2,s.caseStage);history('朕拿一条活人的安稳换了一册账，史官把这笔交易记得很轻。','主线')}},{label:'暂不声张，暗中跟线',desc:'皇权 +2，但证人可能被灭口',run:()=>{s.authority=clamp(s.authority+2);history('朕让裴宁继续跟线。宫里安静了一夜，渡口却少了一个人。','主线')}}]};if(s.caseStage>=2&&s.year===1&&s.season===3)return{title:'玉牒有价',text:'沈氏把支持储君的名单送进来，名单背面写着旧案封口的价码。',choices:[{label:'拒绝交易，公开审资格',desc:'皇权 -3，沈氏支持 -8，储君更独立',run:()=>{s.authority=clamp(s.authority-3);s.factions.shen=clamp(s.factions.shen-8);s.heirs[1].public=clamp(s.heirs[1].public+5);history('朕拒绝用女儿的名字封一桩旧案，沈氏第一次公开退席。','主线')}},{label:'接受名单，换旧账原件',desc:'情报 +4，沈氏支持 +8，留下承诺',run:()=>{s.intel+=4;s.factions.shen=clamp(s.factions.shen+8);history('朕收下旧账原件，也收下沈氏写在边角的那句“日后请还”。','主线')}},{label:'限定协商，只给一个席位',desc:'皇权 +1，双方关系紧绷',run:()=>{s.authority=clamp(s.authority+1);s.factions.shen=clamp(s.factions.shen-2);history('朕把交易拆成一项公开承诺，谁都不能再假装它不存在。','主线')}}]};if(s.military<40)return{title:'宫门听雨',text:'欠饷边军逼近京城。诉求和兵变混在一起，最先抵达的是恐慌。',choices:[{label:'按实际欠饷给足军粮',desc:'国库 -30，军备 +10，卫氏支持 +4',run:()=>{s.treasury-=30;s.military=clamp(s.military+10);s.factions.wei=clamp(s.factions.wei+4);history('朕先给粮，再问谁把军饷写成了空账。','危机')}},{label:'分辨首谋，谈判交接',desc:'皇权 +3，但军备暂不恢复',run:()=>{s.authority=clamp(s.authority+3);history('朕让卫昭把军阵拆成诉求与野心，先让刀口离开城门。','危机')}},{label:'调沈氏私兵入宫',desc:'皇权 +4，沈氏支持 +10，军政更深纠缠',run:()=>{s.authority=clamp(s.authority+4);s.factions.shen=clamp(s.factions.shen+10);history('朕借沈氏的兵守住宫门，也让他们知道宫门可以被他们守住。','危机')}}]};if(s.caseStage>=3&&s.caseStage<4)return{title:'朱批在我',text:'先帝的朱批成为证据。公开它，会伤及皇位合法性；封存它，朕就要把这把刀交给下一代。',choices:[{label:'公开追责，连朕也写进责任',desc:'皇权 -8，机构独立性提升，获得真实史书',run:()=>{s.authority=clamp(s.authority-8);s.caseStage=4;s.caseFlags.public=true;history('朕公开先帝朱批，也公开承认今日的皇位并不天然高于昨日的错误。','主线')}},{label:'部分公开，封存核心朱批',desc:'皇权 +3，得到短期稳定，秘密留到下一代',run:()=>{s.authority=clamp(s.authority+3);s.caseStage=4;s.caseFlags.sealed=true;history('朕公开死者名册，封存先帝朱批。史书从此有两个版本。','主线')}},{label:'继续封存，登记保管者',desc:'皇权 +5，但内廷影响 +8',run:()=>{s.authority=clamp(s.authority+5);s.factions.court=clamp(s.factions.court+8);s.caseStage=4;s.caseFlags.sealed=true;history('朕把朱批锁进内廷，把钥匙交给裴宁。真相因此多活了一代。','主线')}}]};if(s.authority<30&&s.factions.shen>60)return{title:'逼宫筹备',text:'沈氏掌握超过六成关键席位，皇权跌破三十。有人开始把“请太上皇听政”写进私函。',choices:[{label:'拆分席位，公开任官',desc:'皇权 -2，沈氏支持 -12，风险下降',run:()=>{s.authority=clamp(s.authority-2);s.factions.shen=clamp(s.factions.shen-12);history('朕拆分沈氏席位，让每一把椅子重新拥有不同的主人。','危机')}},{label:'让步换三季安稳',desc:'皇权 +4，但沈氏支持 +8，留下政治债',run:()=>{s.authority=clamp(s.authority+4);s.factions.shen=clamp(s.factions.shen+8);history('朕用三季承诺换一夜安稳，承诺从今日起有了利息。','危机')}}]};return null}
function handover(){if(!s.heir){openModal('没有合法储君','先册立一位储君，或者等待宗室候选进入交接名单。',[]);return}const h=s.heirs.find(x=>x.id===s.heir),support=heirSupport(h);if(support<60){openModal('交接危机',''+h.name+'的支持度只有 '+support+'。沈氏要求三个关键席位，卫氏要求军饷直达；你可以让步，也可以把禅位暂缓。',[{label:'让步换平稳交接',desc:'皇权 -8，沈氏支持 +8，接管下一代',run:()=>{s.authority=clamp(s.authority-8);s.factions.shen=clamp(s.factions.shen+8);s.ruler=h.name;history(h.name+'接过玉玺。她继承的第一件东西，是母亲没有还完的债。','交接')}},{label:'暂缓禅位',desc:'保留当前控制，储君支持 +5',run:()=>{h.official=clamp(h.official+5);history('朕暂缓禅位，先让储君在朝堂上拥有一件真正由她负责的事。','交接')}}]);return}s.ruler=h.name;s.authority=clamp(s.authority+4);history(h.name+'在百官面前接过玉玺。旧臣没有自动成为她的亲信。','交接');render()}
function openModal(title,text,choices,closable=true){modalOpen=true;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalChoices').innerHTML=(choices||[]).map((c,i)=>`<button class="choice" data-choice="${i}"><b>${c.label}</b><span>${c.desc}</span></button>`).join('');$('modal').classList.add('show');document.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>{const c=choices[i];modalOpen=false;$('modal').classList.remove('show');if(c&&c.run)c.run();render()});$('modalClose').style.display=closable?'block':'none'}
$('modalClose').onclick=()=>{modalOpen=false;$('modal').classList.remove('show')};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{s.view=b.dataset.view;render()});$('saveBtn').onclick=()=>{save();openModal('存档完成','这一季的账、关系与承诺都已写入本机浏览器。',[])};$('loadBtn').onclick=()=>{const q=JSON.parse(localStorage.getItem('chunting-save')||'null');if(q&&q.version===VERSION){s=q;render();openModal('读档完成','史册没有少一页。',[])}else openModal('没有可用存档','先走过一季，才有可以交给下一代的东西。',[])};$('restartBtn').onclick=()=>{if(confirm('重开会清除本机的《春庭录》存档，确定吗？')){s=structuredClone(initial);addLog('新王登基，雪还没有化。');render()}};
render();if(!s.tutorialSeen){s.tutorialSeen=true;save();openModal('三步上手 · 先看奏报','每季有 3 点御前行动：先在御前查看奏报，再进入朝臣、后宫或子嗣页面选择具体人物。所有会消耗行动的按钮都会写明“· 1行动”。用完后点“结束本季”，确认收入、支出与风险。',[{label:'知道了，开始听政',desc:'进入御前，先处理本季最要紧的一件事。'}])}
</script></body></html>
